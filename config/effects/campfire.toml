[[layers]]
effect = "script"
speed  = 1.0
code   = "fire_color(pixel, len, frame, 5.0 / speed, 0.42, 0.75)"

[[layers]]
effect = "script"
mode   = "add"
speed  = 1.0
code   = """
let slot   = frame / (6.0 / speed).to_int();
let age    = frame % (6.0 / speed).to_int();
if age > 2 { return rgb(0, 0, 0); }
let weight = pow(1.0 - pixel.to_float() / len.to_float(), 1.8);
if hash(pixel ^ slot * 41143) > weight * 0.55 { return rgb(0, 0, 0); }
let b = sin(age.to_float() / 2.0 * 3.14159);
rgb_f(b, b * 0.52, 0.0)
"""
