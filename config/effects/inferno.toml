[[layers]]
effect = "script"
speed  = 1.0
code   = "fire_color(pixel, len, frame, 2.0 / speed, 0.62, 0.45)"

[[layers]]
effect = "script"
mode   = "add"
speed  = 1.0
code   = """
let reach = len.to_float() * 0.28;
let raw   = 1.0 - pixel.to_float() / reach;
if raw <= 0.0 { return rgb(0, 0, 0); }
let pulse = 0.65 + 0.35 * sin(time * speed * 0.18);
dim(rgb(255, 240, 180), raw * raw * pulse)
"""
