name = "Pulse"

[[params]]
name = "color"
label = "Color"
[params.control]
type = "color"
[params.default]
type = "color"
value = {r = 255, g = 255, b = 255}

[[params]]
name = "speed"
label = "Plasma Speed"
[params.control]
type = "slider"
min = 0.1
max = 3.0
[params.default]
type = "number"
value = 1.0

[[params]]
name = "breathe_speed"
label = "Breathe Speed"
[params.control]
type = "slider"
min = 0.005
max = 0.15
step = 0.005
[params.default]
type = "number"
value = 0.04

[script]
code = """
let x = pixel.to_float() / len.to_float();
let s = time * speed * 0.05;
let v = sin(x * 10.0 + s) + sin(x * 4.0 - s * 0.7)
      + sin(x *  7.0 + s * 0.5) + sin(x * 2.0 + s * 1.3);
let plasma = from_hue((v + 4.0) / 8.0 * 360.0);
let b = wave(time * breathe_speed);
add_colors(plasma, dim(color, b * 0.6))
"""
