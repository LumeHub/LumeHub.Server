name = "Comet"

[[params]]
name = "speed"
label = "Speed"
[params.control]
type = "slider"
min = 0.1
max = 2.0
[params.default]
type = "number"
value = 0.4

[[params]]
name = "width"
label = "Width"
[params.control]
type = "slider"
min = 2.0
max = 20.0
[params.default]
type = "number"
value = 5.0

[script]
code = """
let sf  = scanner_factor(pixel, len, time, speed, width);
let hue = fract(t + time * 0.004) * 360.0;
dim(from_hue(hue), sf * sf)
"""
