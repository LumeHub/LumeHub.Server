name = "Plasma"

[[params]]
name = "speed"
label = "Speed"
[params.control]
type = "slider"
min = 0.1
max = 3.0
[params.default]
type = "number"
value = 1.0

[script]
code = """
let x = pixel.to_float() / len.to_float();
let s = time * speed * 0.05;
let v = sin(x * 10.0 + s) + sin(x * 4.0 - s * 0.7)
      + sin(x *  7.0 + s * 0.5) + sin(x * 2.0 + s * 1.3);
from_hue((v + 4.0) / 8.0 * 360.0)
"""
