name = "Phase Shift"

[[params]]
name = "speed1"
label = "Speed 1"
[params.control]
type = "slider"
min = 0.1
max = 3.0
[params.default]
type = "number"
value = 1.0

[[params]]
name = "speed2"
label = "Speed 2"
[params.control]
type = "slider"
min = 0.1
max = 3.0
[params.default]
type = "number"
value = 1.0

[script]
code = """
let p = pixel.to_float() / len.to_float();
let a = from_hue(p * 360.0 + (time * speed1 * 0.2) % 360.0);
let b = from_hue(p * 360.0 + (time * speed2 * 2.7) % 360.0);
add_colors(dim(a, 0.5), dim(b, 0.5))
"""
