# Solar wind — aurora structure in warm oranges and yellows, like a chromosphere.
[[layers]]
effect = "script"
code   = """
let p  = pixel.to_float();
let w1 = sin(p * 0.09  + time * 0.021) * 0.5 + 0.5;
let w2 = sin(p * 0.05  - time * 0.014 + 1.3) * 0.5 + 0.5;
let w3 = sin(p * 0.13  + time * 0.016 + 4.7) * 0.5 + 0.5;
let w4 = sin(p * 0.033 - time * 0.009 + 2.8) * 0.5 + 0.5;
let intensity = pow((w1 * w2 + w3 * w4) / 2.0, 1.3);
let hue = 22.0 + w3 * 40.0 + w1 * 18.0;
dim(from_hue(hue), intensity)
"""
