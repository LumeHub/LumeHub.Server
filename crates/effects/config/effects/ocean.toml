name = "Ocean"

[[params]]
name = "speed"
label = "Speed"
[params.control]
type = "slider"
min = 0.1
max = 3.0
[params.default]
type = "number"
value = 1.0

[script]
code = """
let x     = pixel.to_float();
let s     = time * speed * 0.03;
let w     = sin(x * 0.12 - s)        * 0.50
          + sin(x * 0.31 - s * 1.37) * 0.28
          + sin(x * 0.55 + s * 0.82) * 0.13;
let depth = pow((w + 0.91) / 1.82, 0.7);
let r     = depth * depth * 0.18;
let g     = depth * 0.55;
let b     = 0.18 + depth * 0.82;
let foam  = clamp((depth - 0.80) * 6.0, 0.0, 1.0);
rgb_f(mix(r, 1.0, foam * 0.9), mix(g, 1.0, foam), mix(b, 1.0, foam * 0.7))
"""
